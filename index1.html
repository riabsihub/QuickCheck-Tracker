<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickCheck Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wider text-sky-400">QUICK<span class="text-white">CHECK</span></h1>
        <div class="space-x-2">
            <button onclick="switchTab('tracker')" id="btn-tracker" class="bg-sky-600 px-3 py-1.5 rounded-lg text-sm font-semibold transition">Tracker</button>
            <button onclick="switchTab('history')" id="btn-history" class="bg-slate-800 px-3 py-1.5 rounded-lg text-sm font-semibold text-slate-400 hover:text-white transition">Log</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-24 space-y-6">

        <!-- TRACKER TAB -->
        <section id="tab-tracker" class="space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-200">Daily Checklist</h2>
                <button onclick="openAddModal()" class="bg-sky-500 hover:bg-sky-600 text-slate-950 font-bold px-3 py-1.5 rounded-xl text-sm transition">+ New Task</button>
            </div>

            <!-- Task List -->
            <div id="task-list" class="space-y-3">
                <!-- Injected via JS -->
            </div>
        </section>

        <!-- HISTORY LOG TAB -->
        <section id="tab-history" class="hidden space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-200">Activity History</h2>
                <button onclick="clearHistory()" class="text-xs text-red-400 hover:underline">Clear Log</button>
            </div>
            <div id="history-list" class="space-y-2">
                <!-- Injected via JS -->
            </div>
        </section>

    </main>

    <!-- Add Task Modal -->
    <div id="task-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm p-6 rounded-2xl space-y-4">
            <h3 class="text-lg font-bold">Add New Checklist Item</h3>
            <input type="text" id="task-name-input" placeholder="e.g., Did I lock the door?" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-sky-500">
            <div class="flex gap-3 pt-2">
                <button onclick="closeAddModal()" class="flex-1 bg-slate-800 py-2.5 rounded-xl text-slate-300 font-semibold">Cancel</button>
                <button onclick="saveNewTask()" class="flex-1 bg-sky-500 hover:bg-sky-600 text-slate-950 font-bold py-2.5 rounded-xl">Save</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Initial default tasks if none exist
        let tasks = JSON.parse(localStorage.getItem('quick_tasks')) || [
            { id: 1, name: 'Did I close the door?' },
            { id: 2, name: 'Did I feed the dog?' }
        ];

        let historyLog = JSON.parse(localStorage.getItem('quick_history')) || [];

        function switchTab(tab) {
            if (tab === 'tracker') {
                document.getElementById('tab-tracker').classList.remove('hidden');
                document.getElementById('tab-history').classList.add('hidden');
                document.getElementById('btn-tracker').className = "bg-sky-600 px-3 py-1.5 rounded-lg text-sm font-semibold transition";
                document.getElementById('btn-history').className = "bg-slate-800 px-3 py-1.5 rounded-lg text-sm font-semibold text-slate-400 hover:text-white transition";
                renderTasks();
            } else {
                document.getElementById('tab-tracker').classList.add('hidden');
                document.getElementById('tab-history').classList.remove('hidden');
                document.getElementById('btn-history').className = "bg-sky-600 px-3 py-1.5 rounded-lg text-sm font-semibold transition";
                document.getElementById('btn-tracker').className = "bg-slate-800 px-3 py-1.5 rounded-lg text-sm font-semibold text-slate-400 hover:text-white transition";
                renderHistory();
            }
        }

        function renderTasks() {
            const container = document.getElementById('task-list');
            if (tasks.length === 0) {
                container.innerHTML = `<p class="text-slate-500 text-center py-8">No tasks added yet. Create one above!</p>`;
                return;
            }

            container.innerHTML = tasks.map(task => `
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-col gap-3">
                    <div class="flex justify-between items-center">
                        <span class="font-medium text-slate-100">${task.name}</span>
                        <button onclick="deleteTask(${task.id})" class="text-slate-600 hover:text-red-400 text-sm">&times;</button>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="logAction(${task.id}, '${task.name}', 'Yes')" class="flex-1 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 py-2 rounded-lg text-sm font-semibold transition">Yes</button>
                        <button onclick="logAction(${task.id}, '${task.name}', 'No')" class="flex-1 bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-500/30 py-2 rounded-lg text-sm font-semibold transition">No</button>
                    </div>
                </div>
            `).join('');
        }

        function logAction(taskId, taskName, answer) {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const dateString = now.toLocaleDateString();

            const entry = {
                id: Date.now(),
                taskName: taskName,
                answer: answer,
                time: `${dateString} at ${timeString}`
            };

            historyLog.unshift(entry);
            localStorage.setItem('quick_history', JSON.stringify(historyLog));

            // Brief visual feedback on the button click
            alert(`Logged: "${taskName}" -> ${answer} at ${timeString}`);
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            if (historyLog.length === 0) {
                container.innerHTML = `<p class="text-slate-500 text-center py-8">No actions logged yet.</p>`;
                return;
            }

            container.innerHTML = historyLog.map(item => `
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between items-center text-sm">
                    <div>
                        <span class="font-semibold text-slate-200">${item.taskName}</span>
                        <div class="text-xs text-slate-500">${item.time}</div>
                    </div>
                    <span class="px-2.5 py-1 rounded-md text-xs font-bold ${item.answer === 'Yes' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-400 border border-rose-500/30'}">
                        ${item.answer}
                    </span>
                </div>
            `).join('');
        }

        function openAddModal() {
            document.getElementById('task-modal').classList.remove('hidden');
            document.getElementById('task-modal').classList.add('flex');
            document.getElementById('task-name-input').value = '';
            document.getElementById('task-name-input').focus();
        }

        function closeAddModal() {
            document.getElementById('task-modal').classList.add('hidden');
            document.getElementById('task-modal').classList.remove('flex');
        }

        function saveNewTask() {
            const name = document.getElementById('task-name-input').value.trim();
            if (!name) return;

            tasks.push({ id: Date.now(), name: name });
            localStorage.setItem('quick_tasks', JSON.stringify(tasks));

            closeAddModal();
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            localStorage.setItem('quick_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function clearHistory() {
            if (confirm("Clear your log history?")) {
                historyLog = [];
                localStorage.removeItem('quick_history');
                renderHistory();
            }
        }

        // Initial render
        renderTasks();
    </script>
</body>
</html>
